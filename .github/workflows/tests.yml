name: Tests

# Every push and pull request runs the unit tests on Windows (the only platform Vocalm runs on) and checks the
# dashboard's JavaScript parses, so a broken change shows up here before it reaches a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --quiet -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: The dashboard's JavaScript parses
        run: node --check vocalm/web/app.js
